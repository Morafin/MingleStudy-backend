name: Frontend Build Check

# Runs on every push and PR that touches the frontend, so build-breaking
# changes (bad TypeScript, bad CSS, etc.) get caught here instead of being
# discovered later from a production screenshot.
on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check + build (tsc -b && vite build)
        run: npm run build

      - name: Upload build output (optional, for inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: frontend/dist
          retention-days: 5
