spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
spring.jpa.open-in-view=false

minglestudy.telegram.bot-token=${TELEGRAM_BOT_TOKEN}
minglestudy.cors.allowed-origin=${CORS_ALLOWED_ORIGIN}
minglestudy.storage-path=${MINGLESTUDY_STORAGE_PATH:/data/books}
minglestudy.public-url=${MINGLESTUDY_PUBLIC_URL:https://minglestudy-backend-production.up.railway.app}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
