spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:minglestudy;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.open-in-view=false

minglestudy.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
minglestudy.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

telegram.bot.token=${TELEGRAM_BOT_TOKEN}
